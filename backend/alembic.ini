# Alembic configuration file
# Reference: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts
script_location = alembic

# Template for migration file names
# %%(rev)s  — short revision hash
# %%(slug)s — description slug
# %%(year)d / %%(month).2d / %%(day).2d — date components
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# sys.path adjustment for resolving app imports
prepend_sys_path = .

# Timezone for --autogenerate file timestamps (optional)
timezone = UTC

# Truncate the slug to this many characters
truncate_slug_length = 40

# Whether to emit "BEGIN" automatically
# For asyncpg the transaction is handled by SQLAlchemy — keep this true
transaction_per_migration = true

# ── Logging ──────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
